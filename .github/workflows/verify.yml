name: Offline foundation and workspace checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:design-os
      - run: node scripts/serialize-design-fixtures.ts
      - run: git diff --exit-code -- fixtures/design-os.json
      - run: git diff --check
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:browser
        if: runner.os == 'Linux'
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-browser-evidence
