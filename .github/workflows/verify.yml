name: Offline foundation and workspace checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:design-os
      - run: node scripts/serialize-design-fixtures.ts
      - run: git diff --exit-code -- fixtures/design-os.json
      - run: git diff --check
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run test:browser
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-browser-evidence
      - run: npm run test:browser:providers
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-provider-browser-evidence
      - run: npm run test:browser:regions
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-region-browser-evidence
      - run: npm run test:browser:composition
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-composition-browser-evidence
      - run: npm run test:browser:readiness
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-readiness-browser-evidence
          BVE_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run test:browser:ai-assets
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-ai-assets-browser-evidence
      - run: npm run test:browser:pages
        env:
          BVE_EVIDENCE_DIR: ${{ runner.temp }}/bve-pages-browser-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline-browser-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/bve-browser-evidence
            ${{ runner.temp }}/bve-provider-browser-evidence
            ${{ runner.temp }}/bve-region-browser-evidence
            ${{ runner.temp }}/bve-composition-browser-evidence
            ${{ runner.temp }}/bve-readiness-browser-evidence
            ${{ runner.temp }}/bve-ai-assets-browser-evidence
            ${{ runner.temp }}/bve-pages-browser-evidence
          if-no-files-found: error
